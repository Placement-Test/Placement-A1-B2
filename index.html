<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Placement Test · BBEC Exam Centre</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* =====================================================================
   CONFIGURACIÓN — sólo hay que cambiar API_URL (y opcionalmente el logo)
   ===================================================================== */
const APP = {
  API_URL: 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnR1UZXuKR40TUQgpPoxoegeOg89TkeGhUTyHpEgc9sC4uJqraDTYNlvQACgZ7_GAt-CQ1l-h4RrmPu-9ux71mlASXMz6zsySuIDzlhrM69Y9PnHC3iRKEQbJA2V874RVXhpL6VWARcSrRYnGi_cc-ZTTjxi68hGnFvYR9PiiCY4-U8pfqz9DTkGehkaNP5xxx6kuIkEqzE6pVguR9YY2ESvfqzUDxurrXQOWfGqrQ3v7SXw55k6kyyHpQSCSwOQoQMfVwe0Q_rtshlQ2uvDDgs8KWTd5w&lib=MztnkMfobX8BQG0PCNVplEER8UFjbYLGa/exec',
  CENTER_LOGO_URL: ''                              // opcional: si se deja vacío usa el logo definido en Code.gs
};
</script>
<style>
:root{
  --ink:#1B2A4A; --ink-2:#51607D; --paper:#F1F5FB; --card:#FFFFFF; --line:#D8E0EE;
  --uoe:#6C4CF1; --reading:#0E9C9C; --listening:#F26B1D; --writing:#D6336C; --speaking:#239B45;
  --warn:#F5A524; --danger:#D92D20; --ok:#239B45;
  --display:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --skill:var(--uoe);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--paper);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.locked{user-select:none;-webkit-user-select:none}
body.locked input,body.locked textarea{user-select:text;-webkit-user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--skill);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}

/* ---------- barra superior ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:10px clamp(14px,3vw,28px)}
.brand{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.brand img{height:42px;max-width:150px;object-fit:contain}
.brand .sep{width:1px;height:34px;background:var(--line)}
.school{display:flex;align-items:center;gap:10px;min-width:0}
.school span{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark{display:flex;align-items:center;gap:9px}
.wordmark b{font-family:var(--display);font-size:20px;letter-spacing:.5px}
.wordmark small{display:block;font-size:11.5px;color:var(--ink-2);margin-top:-4px}
[hidden]{display:none!important}
.timer{font-family:var(--display);font-weight:800;font-size:24px;padding:4px 16px;border-radius:999px;background:var(--ink);color:#fff;
  display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;min-width:118px;justify-content:center}
.timer svg{width:20px;height:20px}
.timer.warn{background:var(--warn);color:var(--ink)}
.timer.danger{background:var(--danger);animation:beat 1s steps(2) infinite}
@keyframes beat{50%{opacity:.75}}

/* ---------- sellos de pasaporte (progreso) ---------- */
.stamps{display:flex;justify-content:center;gap:clamp(8px,2.5vw,26px);padding:18px 12px 6px;flex-wrap:wrap}
.stamp{--c:var(--line);width:82px;height:82px;border-radius:50%;border:3px dashed var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--ink-2);font-size:11.5px;font-weight:700;text-align:center;line-height:1.1;transform:rotate(var(--rot,0deg));background:var(--card);position:relative;transition:transform .25s}
.stamp i{font-style:normal;font-size:24px;line-height:1;margin-bottom:3px;filter:grayscale(1);opacity:.6}
.stamp.now{border-style:solid;color:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 18%,transparent)}
.stamp.now i{filter:none;opacity:1}
.stamp.done{background:var(--c);border-style:solid;color:#fff}
.stamp.done i{filter:none;opacity:1}
.stamp.done::after{content:"✓";position:absolute;right:-4px;top:-4px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;display:grid;place-items:center}

/* ---------- contenedores ---------- */
main{max-width:860px;margin:0 auto;padding:18px clamp(14px,3vw,24px) 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(18px,3vw,30px)}
.stack>*+*{margin-top:18px}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>*{flex:1 1 220px}

/* ---------- portada ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:22px;align-items:start}
.hero h1{font-size:clamp(38px,6vw,62px);font-weight:800;letter-spacing:-.5px}
.hero .lead{font-size:19px;margin:12px 0 18px;max-width:34ch}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0;padding:0;list-style:none}
.facts li{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;font-size:15px}
.facts b{display:block;font-family:var(--display);font-size:22px}
.skillsline{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.chip{border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:700;color:#fff}

label.f{display:block;font-weight:700;font-size:14.5px;margin-bottom:12px}
label.f input,label.f select{display:block;width:100%;margin-top:5px;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;font-weight:400}
label.f input:focus,label.f select:focus{border-color:var(--ink);outline:none}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:10px 0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink)}
.tests{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.meter{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.meter div{height:100%;width:0;background:var(--speaking);transition:width .08s}

.btn{border:0;border-radius:999px;padding:13px 26px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:9px;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.skill{background:var(--skill)}
.btn.big{font-size:19px;padding:16px 34px}
.btn.sm{padding:8px 16px;font-size:14.5px}

/* ---------- sección ---------- */
.intro{border-left:8px solid var(--skill)}
.intro .part{font-family:var(--display);font-size:15px;color:var(--skill);font-weight:700}
.intro h2{font-size:clamp(28px,4vw,38px);font-weight:800}
.intro .es{font-size:14.5px;color:var(--ink-2);margin-top:6px}

.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px}
.qhead{display:flex;gap:12px;align-items:flex-start}
.qn{flex:0 0 32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--skill) 14%,#fff);color:var(--skill);font-weight:800;display:grid;place-items:center;font-family:var(--display)}
.qtext{font-size:18px;padding-top:3px;flex:1}
.opts{display:grid;gap:9px;margin-top:12px;padding-left:44px}
.opt{display:flex;align-items:center;gap:12px;padding:11px 15px;border:1.5px solid var(--line);border-radius:var(--r-sm);cursor:pointer;background:#fff;text-align:left;width:100%}
.opt .dot{flex:0 0 20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.opt:hover{border-color:color-mix(in srgb,var(--skill) 55%,var(--line))}
.opt.on{border-color:var(--skill);background:color-mix(in srgb,var(--skill) 8%,#fff)}
.opt.on .dot{border:6px solid var(--skill)}
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px;padding-left:44px}
.pic{border:2px solid var(--line);border-radius:var(--r-md);background:#fff;padding:14px 8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.pic span:first-child{font-size:clamp(44px,8vw,64px);line-height:1.1}
.pic span:last-child{font-size:14.5px;color:var(--ink-2)}
.pic.on{border-color:var(--skill);background:color-mix(in srgb,var(--skill) 9%,#fff);box-shadow:0 0 0 3px color-mix(in srgb,var(--skill) 25%,transparent)}
.gapinput{display:inline-block;width:10.5ch;padding:3px 8px;margin:0 4px;border:none;border-bottom:3px solid var(--skill);background:color-mix(in srgb,var(--skill) 7%,#fff);border-radius:6px 6px 0 0;font-weight:700;text-align:center}
.gapinput:focus{outline:none;background:color-mix(in srgb,var(--skill) 15%,#fff)}
.hint{margin-left:auto;font-family:var(--display);font-weight:800;border:2px solid var(--skill);color:var(--skill);border-radius:8px;padding:0 10px;height:32px;display:flex;align-items:center;white-space:nowrap}

/* textos de lectura */
.notice{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:#FFFDF4;border:2px solid #EADFB5;border-radius:var(--r-md);padding:16px 18px;margin-bottom:12px}
.notice .emo{font-size:46px}
.notice p{margin:0;white-space:pre-line;font-weight:700;font-size:17.5px}
.article{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;margin-bottom:12px}
.article .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.article .top span{font-size:40px}
.article h3{font-size:24px}
.article p{margin:0 0 12px;max-width:68ch}

/* listening */
.player{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:color-mix(in srgb,var(--listening) 9%,#fff);border:1.5px solid color-mix(in srgb,var(--listening) 35%,#fff);border-radius:var(--r-md);padding:12px 16px;margin-bottom:12px}
.playbtn{width:56px;height:56px;border-radius:50%;border:0;background:var(--listening);color:#fff;display:grid;place-items:center;cursor:pointer}
.playbtn svg{width:24px;height:24px}
.playbtn:disabled{background:#C9CFDB;cursor:not-allowed}
.playing .playbtn{animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--listening) 55%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.plays{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink-2)}
.plays i{width:12px;height:12px;border-radius:50%;background:var(--listening)}
.plays i.used{background:#C9CFDB}
.part-title{font-family:var(--display);font-size:20px;font-weight:700;margin:0 0 8px}

/* writing */
.prompt{background:color-mix(in srgb,var(--writing) 7%,#fff);border:1.5px solid color-mix(in srgb,var(--writing) 30%,#fff);border-radius:var(--r-md);padding:18px 20px;white-space:pre-line}
.prompt ul{margin:10px 0 0;padding-left:22px;white-space:normal}
textarea.w{width:100%;min-height:260px;padding:16px;border:1.5px solid var(--line);border-radius:var(--r-md);font-size:18px;line-height:1.6;resize:vertical;background:#fff}
textarea.w:focus{outline:none;border-color:var(--writing)}
.wc{display:flex;justify-content:space-between;font-size:14.5px;color:var(--ink-2);margin-top:6px}
.wc b.okc{color:var(--ok)}

/* speaking */
.frames{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.frame{aspect-ratio:4/3;border-radius:var(--r-md);display:grid;place-items:center;font-size:clamp(52px,10vw,86px);letter-spacing:6px;background:linear-gradient(160deg,#E8F6EC,#D7EEF7);border:6px solid #fff;box-shadow:0 0 0 1px var(--line)}
.frame:nth-child(2){background:linear-gradient(160deg,#FFF1E3,#F3E8FF)}
.frame small{display:block;font-size:14px;letter-spacing:0;text-align:center;color:var(--ink-2);font-family:var(--display);font-weight:700}
.rec{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.recdot{width:14px;height:14px;border-radius:50%;background:var(--danger);animation:beat 1s steps(2) infinite}
.bigcount{font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px clamp(14px,3vw,28px) calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:15}
.foot .muted{font-size:14.5px}

/* capas */
.overlay{position:fixed;inset:0;background:rgba(27,42,74,.82);display:grid;place-items:center;z-index:50;padding:20px}
.overlay .card{max-width:480px;text-align:center}
.overlay h2{font-size:30px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;z-index:60;font-size:15px;max-width:90vw}
.err{background:#FDECEC;color:#8A1C12;border-radius:var(--r-sm);padding:10px 14px;font-size:15px}
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--ink);animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* resultados */
.score{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.score .num{font-family:var(--display);font-size:86px;font-weight:800;line-height:.9}
.scale{position:relative;height:40px;margin:26px 0 8px;display:flex;border-radius:10px;overflow:hidden}
.scale div{display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.marker{position:absolute;top:-14px;width:0;height:68px;border-left:3px solid var(--ink)}
.marker::before{content:attr(data-v);position:absolute;top:-24px;left:-20px;width:40px;text-align:center;font-weight:800;font-size:15px}
.skillrow{display:grid;grid-template-columns:140px 1fr 70px;gap:12px;align-items:center;margin:10px 0;font-size:15.5px}
.track{height:14px;border-radius:9px;background:#EEF1F7;overflow:hidden}
.track div{height:100%;border-radius:9px}
.recbox{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:22px 24px}
.recbox h3{font-size:30px;margin:4px 0}

/* profesor */
.invite{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.qr{background:#fff;padding:12px;border:1px solid var(--line);border-radius:var(--r-md)}
.linkbox{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--paper);padding:10px 12px;border-radius:var(--r-sm);word-break:break-all}
#printCard{display:none}

@media (max-width:760px){
  .hero,.score,.invite{grid-template-columns:1fr}
  .opts,.pics{padding-left:0}
  .brand .sep,.wordmark small{display:none}
  .stamp{width:60px;height:60px;font-size:0}
  .stamp i{font-size:22px;margin:0}
  .skillrow{grid-template-columns:100px 1fr 56px}
  .frames{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}
  body>*:not(#printCard){display:none!important}
  #printCard{display:block!important;text-align:center;font-family:var(--body);padding:30px}
  #printCard img.logo{height:60px;margin:0 16px}
  #printCard h1{font-size:36px;margin:24px 0 6px}
}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="brand">
    <div id="centerBrand"></div>
    <div class="sep" id="brandSep" hidden></div>
    <div class="school" id="schoolBrand"></div>
  </div>
  <div class="timer" id="timer" hidden aria-live="off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>
    <span id="clock">40:00</span>
  </div>
</header>
<nav class="stamps" id="stamps" hidden aria-label="Progreso"></nav>
<main id="app"><div class="spinner"></div></main>
<div id="printCard"></div>

<script>
/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
const S = { token:null, center:null, inv:null, data:null, answers:{}, deadline:0, timerId:null, busy:false };
const SKILLS = [
  {k:'uoe', name:'Use of English', icon:'🧩', color:'var(--uoe)'},
  {k:'reading', name:'Reading', icon:'📖', color:'var(--reading)'},
  {k:'listening', name:'Listening', icon:'🎧', color:'var(--listening)'},
  {k:'writing', name:'Writing', icon:'✏️', color:'var(--writing)'},
  {k:'speaking', name:'Speaking', icon:'🎤', color:'var(--speaking)'}
];
const STEP_SKILL = ['uoe','uoe','reading','listening','writing','speaking'];

async function api(action, data = {}) {
  if (!/^https:\/\/script\.google\.com\//.test(APP.API_URL)) throw new Error('La plataforma aún no está conectada: falta pegar API_URL en index.html (ver guía).');
  let res;
  try {
    res = await fetch(APP.API_URL, { method:'POST', body: JSON.stringify({ action, ...data }) });
  } catch (e) { throw new Error('Sin conexión. Revisa internet y vuelve a intentar.'); }
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Error del servidor');
  if (typeof j.remaining === 'number') setDeadline(j.remaining);
  return j;
}
function toast(msg, ms = 3200) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function view(html) { $('#app').innerHTML = html; window.scrollTo(0, 0); }
function errorView(msg) {
  view(`<div class="card stack"><h2>No se pudo continuar</h2><p class="err">${esc(msg)}</p><button class="btn" onclick="location.reload()">Volver a intentar</button></div>`);
}

/* =====================================================================
   MARCA (logo del centro + logo de la institución)
   ===================================================================== */
function renderBrand() {
  const c = S.center || { name:'BBEC Exam Centre', subtitle:'Platinum Exam Centre' };
  const logo = APP.CENTER_LOGO_URL || c.logo;
  $('#centerBrand').innerHTML = logo
    ? `<img src="${esc(logo)}" alt="${esc(c.name)}">`
    : `<div class="wordmark"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#1B2A4A"/><path d="M11 12h10a5 5 0 0 1 0 10H11zM11 22h12a5 5 0 0 1 0 10H11z" fill="none" stroke="#fff" stroke-width="3"/><circle cx="31" cy="11" r="4" fill="#F5A524"/></svg><div><b>${esc(c.name)}</b><small>${esc(c.subtitle || '')}</small></div></div>`;
  if (S.inv) {
    $('#brandSep').hidden = false;
    $('#schoolBrand').innerHTML = (S.inv.logo ? `<img src="${esc(S.inv.logo)}" alt="">` : '') + `<span>${esc(S.inv.school)}</span>`;
  }
}

/* =====================================================================
   RELOJ
   ===================================================================== */
function setDeadline(sec) { S.deadline = Date.now() + sec * 1000; }
function startClock() {
  $('#timer').hidden = false;
  clearInterval(S.timerId);
  S.timerId = setInterval(() => {
    const left = Math.max(0, Math.round((S.deadline - Date.now()) / 1000));
    $('#clock').textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
    $('#timer').className = 'timer' + (left <= 120 ? ' danger' : left <= 300 ? ' warn' : '');
    if (left === 300) toast('Quedan 5 minutos. / 5 minutes left.');
    if (left === 0) { clearInterval(S.timerId); submitStep(true); }
  }, 500);
}

/* =====================================================================
   SEGURIDAD: pantalla completa, cambio de pestaña, copiar/pegar, atajos
   ===================================================================== */
const Guard = { on:false, lock:false, fs: !!(document.documentElement.requestFullscreen) };
function guardOn() {
  Guard.on = true; document.body.classList.add('locked');
  if (Guard.fs && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  history.pushState(null, '', location.href);
}
function guardOff() {
  Guard.on = false; document.body.classList.remove('locked');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
async function incident(type) {
  if (!Guard.on || Guard.lock || !S.token) return;
  Guard.lock = true; setTimeout(() => Guard.lock = false, 2000);
  if (window.speechSynthesis) speechSynthesis.cancel();
  try {
    const r = await api('viol', { token:S.token, type });

/* =====================================================================
   AUDIO: voces en inglés (síntesis del navegador) o MP3 si se configuró
   ===================================================================== */
let VOICES = [];
function loadVoices() { VOICES = (speechSynthesis.getVoices() || []).filter(v => /^en[-_]/i.test(v.lang)); }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const FEM = /female|samantha|karen|serena|moira|tessa|libby|sonia|hazel|susan|zira|aria|jenny|emma|amy|kate|fiona|victoria|allison|ava|natasha|clara|maisie/i;
const MAS = /\bmale|daniel|alex|fred|george|ryan|guy|david|mark|arthur|oliver|thomas|james|rishi|william|brian|eric|liam/i;
function voiceFor(role) {
  const pref = VOICES.filter(v => /en[-_]GB/i.test(v.lang)).concat(VOICES.filter(v => !/en[-_]GB/i.test(v.lang)));
  const fem = pref.filter(v => FEM.test(v.name) && !/\bmale/i.test(v.name.replace(/female/i,''))), mas = pref.filter(v => MAS.test(v.name) && !FEM.test(v.name));
  if (role === 'W' || role === 'G') return fem[0] || pref[0] || null;
  if (role === 'M' || role === 'B') return mas[0] || pref[1] || pref[0] || null;
  return pref[0] || null;
}
const PITCH = { W:1.05, M:0.92, G:1.3, B:1.18, N:1 };
function sayOne(text, role, rate) {
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    const v = voiceFor(role); if (v) u.voice = v; u.lang = v ? v.lang : 'en-GB';
    u.rate = rate; u.pitch = PITCH[role] || 1; u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function speakLines(lines, rate) {
  speechSynthesis.cancel();
  for (const [role, text] of lines) {
    for (const sentence of (text.match(/[^.!?]+[.!?]*/g) || [text])) await sayOne(sentence.trim(), role, rate);
    await wait(380);
  }
}

function renderStamps(stepIdx) {
  const cur = STEP_SKILL[stepIdx];
  const doneUntil = SKILLS.findIndex(s => s.k === cur);
  $('#stamps').hidden = false;
  $('#stamps').innerHTML = SKILLS.map((s, i) => `<div class="stamp ${i < doneUntil ? 'done' : i === doneUntil ? 'now' : ''}" style="--c:${s.color};--rot:${[-6,4,-3,5,-4][i]}deg" title="${s.name}"><i>${s.icon}</i>${s.name}</div>`).join('');
}

async function loadStep() {
  hideOverlay(); view('<div class="spinner"></div>');
  try {
    const d = await api('step', { token:S.token });
    if (d.done) return finishView(d.summary);
    S.data = d; S.answers = JSON.parse(sessionStorage.getItem('bbec_ans_' + S.token + '_' + d.step) || '{}');
    const skill = STEP_SKILL[d.step];
    document.documentElement.style.setProperty('--skill', `var(--${skill})`);
    renderStamps(d.step);
    const [part, en, es] = INSTR[d.name];
    let html = `<div class="stack"><div class="card intro"><div class="part">${part}</div><h2>${SKILLS.find(s=>s.k===skill).name}</h2><p style="margin:8px 0 0">${en}</p><p class="es">${es}</p></div>`;
    let n = 0;
    if (d.items) html += d.items.map(it => itemHTML(it, ++n)).join('');
    if (d.blocks) html += d.blocks.map(b => `<div>${b.type === 'notice'
        ? `<div class="notice"><span class="emo">${b.img}</span><p>${esc(b.body)}</p></div>`
        : `<div class="article"><div class="top"><span>${b.img}</span><h3>${esc(b.title)}</h3></div>${b.body.split(/\n\n/).map(p => `<p>${esc(p)}</p>`).join('')}</div>`}
        ${b.items.map(it => itemHTML(it, ++n)).join('')}</div>`).join('');
    if (d.parts) html += d.parts.map((p, i) => `<div class="card stack" style="padding:18px">
        ${p.title ? `<p class="part-title">${esc(p.title)}</p>` : ''}
        <div class="player" id="pl_${i}"><button class="playbtn" aria-label="Escuchar" onclick="playClip('${p.clip}',${i})" ${p.playsLeft <= 0 ? 'disabled' : ''}>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
          <div><b>Recording ${i + 1}</b><div class="plays" id="pd_${i}">${dots(p.playsLeft)}</div></div></div>
        ${p.items.map(it => itemHTML(it, ++n)).join('')}</div>`).join('');
    if (d.task) html += writingHTML(d.task);
    if (d.tasks) html += d.tasks.map((t, i) => speakingHTML(t, i)).join('');
    html += `</div>`;
    view(html);
    bindItems();
    if (d.task) bindWriting(d.task);
    const last = d.step === d.total - 1;
    const foot = document.createElement('div'); foot.className = 'foot'; foot.id = 'foot';
    foot.innerHTML = `<span class="muted">Parte ${d.step + 1} de ${d.total}</span><button class="btn skill big" id="nextBtn" onclick="submitStep()">${last ? 'Terminar la prueba' : 'Continuar'}</button>`;
    document.querySelectorAll('#foot').forEach(f => f.remove()); document.body.appendChild(foot);
    if (d.tasks) updateSpeakBtn();
  } catch (e) { errorView(e.message); }
}
const dots = left => `${[0,1].map(i => `<i class="${i < 2 - left ? 'used' : ''}"></i>`).join('')}<span>${left > 0 ? `Te quedan ${left}` : 'Sin reproducciones'}</span>`;

function itemHTML(it, n) {
  let body;
  if (it.t === 'gap') {
    const parts = esc(it.q).split('___');
    body = `<div class="qhead"><span class="qn">${n}</span><div class="qtext">${parts[0]}<input class="gapinput" data-k="${it.k}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(S.answers[it.k] || '')}" aria-label="Respuesta ${n}">${parts.slice(1).join('___')}</div>${it.hint ? `<span class="hint">${esc(it.hint)}</span>` : ''}</div>`;
  } else if (it.t === 'pic') {
    body = `<div class="qhead"><span class="qn">${n}</span><div class="qtext">${esc(it.q)}</div></div>
      <div class="pics" role="radiogroup">${it.o.map(o => { const [e, l] = o.split('|'); return `<button type="button" class="pic ${S.answers[it.k] === o ? 'on' : ''}" data-k="${it.k}" data-v="${esc(o)}" role="radio"><span>${e}</span><span>${esc(l || '')}</span></button>`; }).join('')}</div>`;
  } else {
    body = `<div class="qhead"><span class="qn">${n}</span><div class="qtext">${esc(it.q)}</div></div>
      <div class="opts" role="radiogroup">${it.o.map(o => `<button type="button" class="opt ${S.answers[it.k] === o ? 'on' : ''}" data-k="${it.k}" data-v="${esc(o)}" role="radio"><span class="dot"></span><span>${esc(o)}</span></button>`).join('')}</div>`;
  }
  return `<div class="q">${body}</div>`;
}
function persist() { sessionStorage.setItem('bbec_ans_' + S.token + '_' + S.data.step, JSON.stringify(S.answers)); }
function bindItems() {
  document.querySelectorAll('.opt,.pic').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k; S.answers[k] = b.dataset.v; persist();
    document.querySelectorAll(`[data-k="${k}"]`).forEach(x => x.classList.toggle('on', x === b));
  }));
  document.querySelectorAll('.gapinput').forEach(i => i.addEventListener('input', () => { S.answers[i.dataset.k] = i.value; persist(); }));
}

/* ---- Listening ---- */
let PLAYING = false;
async function playClip(clip, i) {
  if (PLAYING) return;
  const box = $('#pl_' + i), btn = box.querySelector('.playbtn');
  PLAYING = true; document.querySelectorAll('.playbtn').forEach(b => b.disabled = true); box.classList.add('playing');
  try {
    const r = await api('play', { token:S.token, clip });
    $('#pd_' + i).innerHTML = dots(r.playsLeft);
    if (r.url) { const a = new Audio(r.url); await new Promise(res => { a.onended = res; a.onerror = res; a.play().catch(res); }); }
    else await speakLines(r.lines, r.rate);
    btn.dataset.left = r.playsLeft;
  } catch (e) { toast(e.message); btn.dataset.left = 0; }
  box.classList.remove('playing'); PLAYING = false;
  document.querySelectorAll('.player').forEach(p => { const b = p.querySelector('.playbtn'); const left = b.dataset.left; b.disabled = left !== undefined && +left <= 0 || /Sin reproducciones/.test(p.textContent); });
}

/* ---- Writing ---- */
function writingHTML(t) {
  return `<div class="prompt"><b>${esc(t.prompt)}</b><ul>${t.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>
    <textarea class="w" id="wtext" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="sentences" placeholder="Write here in English…">${esc(S.answers.text || '')}</textarea>
    <div class="wc"><span>Escribe al menos <b>${t.min}</b> palabras.</span><span id="wcount">0 palabras</span></div>`;
}
function bindWriting(t) {
  const ta = $('#wtext'), upd = () => { const n = (ta.value.match(/[A-Za-zÀ-ÿ']+/g) || []).length;
    $('#wcount').innerHTML = `<b class="${n >= t.min ? 'okc' : ''}">${n}</b> palabras`; S.answers.text = ta.value; persist(); };
  ta.addEventListener('input', upd); upd();
}

/* ---- Speaking ---- */
function speakingHTML(t, i) {
  const imgs = t.img ? `<div class="frames">${t.img.split('|').map((e, j) => `<div class="frame"><div>${e}<small>Picture ${'AB'[j]}</small></div></div>`).join('')}</div>` : '';
  return `<div class="card" id="sp_${i}"><div class="qhead"><span class="qn">${i + 1}</span><div class="qtext">${esc(t.prompt)}</div></div>${imgs}
    <div class="rec" id="rc_${i}">${t.done ? '<b style="color:var(--ok)">✔ Respuesta guardada</b>' :
    `<button class="btn skill" onclick="speakTask(${i})">🎤 Empezar (15 s para prepararte)</button><span class="muted small">Hablarás hasta ${t.secs} segundos.</span>`}</div></div>`;
}
function updateSpeakBtn() { const all = S.data.tasks.every(t => t.done); $('#nextBtn').disabled = !all; }
async function speakTask(i) {
  const t = S.data.tasks[i], rc = $('#rc_' + i);
  document.querySelectorAll('.rec .btn').forEach(b => b.disabled = true);
  let stream = null;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio:true }); } catch (e) { stream = null; }
  if (!stream) {
    rc.innerHTML = '<span class="err">Micrófono no disponible. Tu profesor evaluará Speaking en forma presencial.</span>';
    await api('speak', { token:S.token, task:t.key, audio:'', transcript:'', secs:0 }).catch(() => {});
    t.done = true; updateSpeakBtn(); document.querySelectorAll('.rec .btn').forEach(b => b.disabled = false); return;
  }
  for (let s = 15; s > 0; s--) { rc.innerHTML = `<span class="bigcount">${s}</span><span class="muted">Prepárate… / Get ready…</span>`; await wait(1000); }
  const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
  const rec = new MediaRecorder(stream, mime ? { mimeType:mime, audioBitsPerSecond:32000 } : undefined);
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  let transcript = '', active = true, sr = null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) { try { sr = new SR(); sr.lang = 'en-GB'; sr.continuous = true; sr.interimResults = false;
    sr.onresult = e => { for (let k = e.resultIndex; k < e.results.length; k++) if (e.results[k].isFinal) transcript += ' ' + e.results[k][0].transcript; };
    sr.onend = () => { if (active) try { sr.start(); } catch (_) {} }; sr.start(); } catch (_) { sr = null; } }
  rec.start(250);
  const t0 = Date.now(); let stopEarly = false;
  await new Promise(res => {
    const tick = () => { const left = t.secs - Math.floor((Date.now() - t0) / 1000);
      if (left <= 0 || stopEarly) return res();
      rc.innerHTML = `<span class="recdot"></span><span class="bigcount">${left}</span><span class="muted">Grabando… habla en inglés</span>${Date.now() - t0 > 12000 ? '<button class="btn sm ghost" id="stopb">Terminé</button>' : ''}`;
      const sb = $('#stopb'); if (sb) sb.onclick = () => { stopEarly = true; };
      setTimeout(tick, 300); };
    tick();
  });
  active = false; if (sr) try { sr.stop(); } catch (_) {}
  await new Promise(res => { rec.onstop = res; rec.stop(); });
  stream.getTracks().forEach(x => x.stop());
  await wait(600);
  rc.innerHTML = '<span class="muted">Guardando tu respuesta…</span>';
  const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
  try {
    await api('speak', { token:S.token, task:t.key, audio: await fileToB64(blob), mime: blob.type, transcript: transcript.trim(), secs: Math.round((Date.now() - t0) / 1000) });
    rc.innerHTML = '<b style="color:var(--ok)">✔ Respuesta guardada</b>'; t.done = true;
  } catch (e) { rc.innerHTML = `<span class="err">${esc(e.message)}</span>`; t.done = true; }
  document.querySelectorAll('.rec .btn').forEach(b => b.disabled = false);
  updateSpeakBtn();
}

/* ---- Enviar sección ---- */
async function submitStep(timeUp = false) {
  if (S.busy) return;
  const d = S.data; if (!d) return;
  if (!timeUp) {
    const keys = [...(d.items || []), ...(d.blocks || []).flatMap(b => b.items), ...(d.parts || []).flatMap(p => p.items)].map(i => i.k);
    const missing = keys.filter(k => !S.answers[k] || !String(S.answers[k]).trim()).length;
    const ok = await askConfirm(missing
      ? `<h2>Tienes ${missing} pregunta(s) sin responder</h2><p>¿Continuar de todas formas? No podrás volver a esta parte.</p>`
      : `<h2>¿Continuar?</h2><p>No podrás volver a esta parte de la prueba.</p>`);
    if (!ok) return;
  }
  S.busy = true; if (window.speechSynthesis) speechSynthesis.cancel();
  const btn = $('#nextBtn'); if (btn) btn.disabled = true;
  try {
    const r = await api('submit', { token:S.token, step:d.step, answers:S.answers });
    if (r.done) { S.busy = false; return finishView(r.summary, timeUp ? 'time' : 'student'); }
    S.busy = false; loadStep();
  } catch (e) { S.busy = false; if (btn) btn.disabled = false; toast(e.message); }
}

/* =====================================================================
   RESULTADOS
   ===================================================================== */
function finishView(sum, reason) {
  guardOff(); clearInterval(S.timerId); $('#timer').hidden = true; $('#stamps').hidden = true;
  document.querySelectorAll('#foot').forEach(f => f.remove()); hideOverlay();
  if (S.inv) sessionStorage.removeItem('bbec_' + S.inv.code);
  const head = (reason || (sum && sum.reason)) === 'security' ? '<p class="err">La prueba se cerró por salir de la pantalla demasiadas veces.</p>'
    : (reason || (sum && sum.reason)) === 'time' ? '<p class="muted">Se acabó el tiempo. Tus respuestas fueron enviadas.</p>' : '';
  if (!sum || sum.hidden) return view(`<div class="card stack" style="text-align:center">${head}<h1>Well done, ${esc(sum ? sum.student : '')}!</h1><p>Tus resultados fueron enviados a tu profesor y al centro examinador.</p><p class="muted">Ya puedes cerrar esta ventana.</p></div>`);
  const bands = [['Pre-A1',80,100,'#9AA5B8'],['A1',100,120,'#6C4CF1'],['A2',120,140,'#0E9C9C'],['B1',140,160,'#F26B1D'],['B2',160,180,'#D6336C'],['C1',180,200,'#239B45']];
  const pos = v => (Math.min(Math.max(v, 80), 200) - 80) / 120 * 100;
  view(`<div class="stack">${head}
    <div class="card"><div class="score"><div><div class="num">${sum.overall}</div><div class="muted small">Cambridge English Scale</div></div>
      <div><h1 style="font-size:clamp(28px,4vw,40px)">Well done, ${esc(sum.student)}!</h1><p class="muted" style="margin:6px 0 0">Tu nivel estimado es <b>${sum.cefr}</b> del Marco Común Europeo.</p></div></div>
      <div class="scale">${bands.map(b => `<div style="flex:1;background:${b[3]}">${b[0]}</div>`).join('')}<span class="marker" style="left:${pos(sum.overall)}%" data-v="${sum.overall}"></span></div>
      <div class="small muted" style="display:flex;justify-content:space-between"><span>80</span><span>100</span><span>120</span><span>140</span><span>160</span><span>180</span><span>200</span></div></div>
    <div class="recbox"><div class="small" style="opacity:.8">Examen recomendado</div><h3>${esc(sum.rec.exam)}</h3><div>${esc(sum.rec.grade)}</div>${sum.rec.note ? `<p class="small" style="opacity:.85;margin-bottom:0">${esc(sum.rec.note)}</p>` : ''}</div>
    <div class="card">${SKILLS.map(s => { const v = sum.scores[s.k];
      return `<div class="skillrow"><span>${s.icon} ${s.name}</span><div class="track"><div style="width:${v == null ? 0 : pos(v)}%;background:${s.color}"></div></div><b>${v == null ? '—' : v}</b></div>`; }).join('')}
      ${sum.speakingPending ? '<p class="small muted">Speaking queda pendiente de revisión por tu profesor.</p>' : ''}</div>
    <p class="small muted" style="text-align:center">Resultados enviados a tu profesor y al centro examinador. Ya puedes cerrar esta ventana.</p></div>`);
}

boot();
</script>
